              {% set m = hn.m %}
              <ha-icon icon="mdi:table"></ha-icon> **{{ T.h_table }}**

              {% if m %}
              {% set e = m[0] %}
              {% set ys = state_attr(e, 'yearly') or [] %}
              {% set since = (state_attr(e, 'since') or '') | string %}
              {% set done = ys | selectattr('year', 'lt', now().year) | list %}
              {% set recent = done[-5:] %}
              {{ T.t_intro }}

              | {{ T.c_year }} | {{ T.c_paid }} | {{ T.c_ref }} | {{ T.c_net }} |
              |---|--:|--:|--:|
              {% for y in ys | reverse -%}
