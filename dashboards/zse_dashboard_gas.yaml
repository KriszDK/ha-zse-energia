              {%- else -%}–{%- endif -%}
              {%- endmacro %}
              {% macro eur(key) -%}
              {%- set x = find(key) -%}
              {%- if x and states(x) not in ['unknown', 'unavailable'] -%}{{ m2(states(x)) }}{{ T.nb }}€{%- else -%}–{%- endif -%}
              {%- endmacro %}
