              - {{ T.l_tariff }}: **{{ val('tariff') }}**

              *{{ T.l_settle_note }}*
              {% else %}
              *Update ZSE Energia to 0.5.0 or newer and restart Home Assistant: the dashboard texts come from its "Dashboard language" sensor.*
              {% endif %}
          - type: markdown
            content: |
              {% set u = integration_entities('zse_energia') | select('is_state_attr', 'zse_key', 'ui') | list %}
              {% set T = state_attr(u[0], 't') if u else none %}
              {% if T %}
              {% macro m2(v) -%}{{ '{:,.2f}'.format(v | float(0)) | replace(',', '#') | replace('.', T.ds) | replace('#', T.ts) }}{%- endmacro %}
              {% macro m0(v) -%}{{ '{:,.0f}'.format(v | float(0)) | replace(',', '#') | replace('#', T.ts) }}{%- endmacro %}
              {% set kind = 'gas' %}
              {% set hn = namespace(m=[]) %}
              {% for x in integration_entities('zse_energia') | select('is_state_attr', 'zse_history', true) %}{% set k = state_attr(x, 'zse_kinds') %}{% if not k or kind in k %}{% set hn.m = hn.m + [x] %}{% endif %}{% endfor %}
              {% set m = hn.m %}
