              *{{ T.net_caption }}*
              - {{ T.adv }}: {{ m2(y.advances) }}{{ T.nb }}€
              - {{ T.extra }}: {{ m2(y.settlements + y.other) }}{{ T.nb }}€
              - {{ T.refund }}: {{ m2(y.refunds) }}{{ T.nb }}€
              {%- else -%}
              –
              {%- endif -%}
              {%- endmacro %}
              {% if m %}
              {% set ys = state_attr(m[0], 'yearly') or [] %}
              {{ blk(ys, now().year, T.this_label) }}

              {{ blk(ys, now().year - 1, T.last_label) }}

              *{{ T.years_note }}*
              {% else %}
              {{ T.notfound }}
              {% endif %}
              {% else %}
              *Update ZSE Energia to 0.5.0 or newer and restart Home Assistant: the dashboard texts come from its "Dashboard language" sensor.*
              {% endif %}
      - type: grid
