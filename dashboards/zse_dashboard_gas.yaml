              {%- endmacro %}
              <ha-icon icon="mdi:table"></ha-icon> **{{ T.t_period }}**

              {% set gl = find('gas_consumption_last') %}
              {% set ps = (state_attr(gl, 'periods') or []) if gl else [] %}
              {% if ps %}
              | {{ T.t_period }} | kWh |
              |---|--:|
              {% for q in ps | reverse -%}
              | {{ q['from'] }} – {{ q['to'] }} | **{{ m0(q.kwh) }}** |
