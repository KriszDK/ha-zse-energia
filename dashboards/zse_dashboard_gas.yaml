              {%- if x and states(x) in ['on', 'off'] -%}{{ T.yes if states(x) == 'on' else T.no }}{%- else -%}–{%- endif -%}
              {%- endmacro %}
              <ha-icon icon="mdi:file-document-check"></ha-icon> **{{ T.h_settle }}**

              ## {{ val('next_settlement') }}
              *{{ T.l_settle_caption }}*

