# ZSE Energia - kész dashboard (magyar), "sections" elrendezés, Home Assistant 2024.3 vagy újabb kell hozzá.
#
# Használat
#   1. Cseréld ki az összes  __ZU__  szöveget a szerződéses számlád számára (a számlákon a "változó szimbólum",
#      10 számjegy). Ez része a statisztikák azonosítójának, pl. zse_energia:advances_paid_6300000001.
#      PowerShell:  (Get-Content zse_dashboard.hu.yaml) -replace '__ZU__','6300000001' | Set-Content zse_sajat.yaml
#   2. Beállítások -> Irányítópultok -> Irányítópult hozzáadása -> Új irányítópult a semmiből -> nyisd meg ->
#      ceruza -> három pont -> "Nyers konfigurációszerkesztő", és illeszd be a teljes fájlt.
#
# A grafikonok a hosszú távú STATISZTIKÁKBÓL olvasnak (az integráció írja őket), ezért a teljes ~15 éves
# előzményt mutatják. A Markdown kártyák maguktól megtalálják az integráció szenzorait ("zse_key" attribútum), azonosítót nem kell átírni.
#
# Ha egy statisztikás grafikon üres: Fejlesztői eszközök -> Statisztikák -> keress "zse_energia:" sorokat
# (az integráció első frissítése után egy perccel jelennek meg).
title: ZSE
views:
  - title: Befizetések
    path: zse-payments
    icon: mdi:cash-multiple
    type: sections
    max_columns: 2
    sections:
      # ================================================================== status and this/last year
      - type: grid
        cards:
          - type: heading
            heading: Következő fizetés
            heading_style: title
            icon: mdi:calendar-clock
          - type: markdown
            content: |
              {% macro m2(v) -%}{{ '{:,.2f}'.format(v | float(0)) | replace(',', '#') | replace('.', ',') | replace('#', ' ') }}{%- endmacro %}
              {% macro m0(v) -%}{{ '{:,.0f}'.format(v | float(0)) | replace(',', '#') | replace('#', ' ') }}{%- endmacro %}
              {% set ids = integration_entities('zse_energia') %}
              {% macro val(key) -%}
              {%- set m = ids | select('is_state_attr', 'zse_key', key) | list -%}
              {%- if m and states(m[0]) not in ['unknown', 'unavailable'] -%}
              {%- set st = states(m[0]) -%}
              {%- set u = state_attr(m[0], 'unit_of_measurement') -%}
              {%- if u and is_number(st) -%}{{ m0(st) }} {{ u }}{%- else -%}{{ st }}{%- endif -%}
              {%- else -%}–{%- endif -%}
              {%- endmacro %}
              {% macro eur(key) -%}
              {%- set m = ids | select('is_state_attr', 'zse_key', key) | list -%}
              {%- if m and states(m[0]) not in ['unknown', 'unavailable'] -%}{{ m2(states(m[0])) }} €{%- else -%}–{%- endif -%}
              {%- endmacro %}
              {% macro yn(key) -%}
              {%- set m = ids | select('is_state_attr', 'zse_key', key) | list -%}
              {%- if m and states(m[0]) in ['on', 'off'] -%}{{ 'igen' if states(m[0]) == 'on' else 'nem' }}{%- else -%}–{%- endif -%}
              {%- endmacro %}
              ## {{ val('next_payment_date') }}
              ### {{ eur('next_payment_amount') }}
              *következő fizetési határidő*

              - Nyitott összeg: **{{ eur('to_pay') }}**
              - Lejárt: **{{ eur('overdue') }}**
              - Havi előleg: **{{ eur('advance_amount') }}**
              - Fizetési mód: **{{ val('payment_method') }}**
          - type: heading
            heading: Elszámolás
            heading_style: title
            icon: mdi:file-document-check
          - type: markdown
            content: |
              {% macro m2(v) -%}{{ '{:,.2f}'.format(v | float(0)) | replace(',', '#') | replace('.', ',') | replace('#', ' ') }}{%- endmacro %}
              {% macro m0(v) -%}{{ '{:,.0f}'.format(v | float(0)) | replace(',', '#') | replace('#', ' ') }}{%- endmacro %}
              {% set ids = integration_entities('zse_energia') %}
              {% macro val(key) -%}
              {%- set m = ids | select('is_state_attr', 'zse_key', key) | list -%}
              {%- if m and states(m[0]) not in ['unknown', 'unavailable'] -%}
              {%- set st = states(m[0]) -%}
              {%- set u = state_attr(m[0], 'unit_of_measurement') -%}
              {%- if u and is_number(st) -%}{{ m0(st) }} {{ u }}{%- else -%}{{ st }}{%- endif -%}
              {%- else -%}–{%- endif -%}
              {%- endmacro %}
              {% macro eur(key) -%}
              {%- set m = ids | select('is_state_attr', 'zse_key', key) | list -%}
              {%- if m and states(m[0]) not in ['unknown', 'unavailable'] -%}{{ m2(states(m[0])) }} €{%- else -%}–{%- endif -%}
              {%- endmacro %}
              {% macro yn(key) -%}
              {%- set m = ids | select('is_state_attr', 'zse_key', key) | list -%}
              {%- if m and states(m[0]) in ['on', 'off'] -%}{{ 'igen' if states(m[0]) == 'on' else 'nem' }}{%- else -%}–{%- endif -%}
              {%- endmacro %}
              ## {{ val('next_settlement') }}
              *következő éves elszámolás*

              - Utolsó elszámolás: **{{ eur('last_settlement_amount') }}** ({{ val('last_settlement_date') }})
              - Tarifa: **{{ val('tariff') }}**

              *A negatív összeg azt jelenti, hogy pénzt kaptál vissza (túlfizetés).*
          - type: heading
            heading: Idén és tavaly
            heading_style: title
            icon: mdi:chart-box
          - type: markdown
            content: |
              {% macro m2(v) -%}{{ '{:,.2f}'.format(v | float(0)) | replace(',', '#') | replace('.', ',') | replace('#', ' ') }}{%- endmacro %}
              {% macro m0(v) -%}{{ '{:,.0f}'.format(v | float(0)) | replace(',', '#') | replace('#', ' ') }}{%- endmacro %}
              {% set m = integration_entities('zse_energia') | select('is_state_attr', 'zse_history', true) | list %}
              {% macro blk(ys, year, label) -%}
              {%- set r = ys | selectattr('year', 'eq', year) | list -%}
              ### {{ year }} · {{ label }}
              {% if r -%}
              {%- set y = r[0] -%}
              ## {{ m2(y.net) }} €
              *nettó kifizetve (befizetések mínusz visszautalások)*
              - Havi előlegek: {{ m2(y.advances) }} €
              - Elszámolási pótlék és egyéb befizetés: {{ m2(y.settlements + y.other) }} €
              - Visszakaptál: {{ m2(y.refunds) }} €
              {%- else -%}
              –
              {%- endif -%}
              {%- endmacro %}
              {% if m %}
              {% set ys = state_attr(m[0], 'yearly') or [] %}
              {{ blk(ys, now().year, 'idén, eddig') }}

              {{ blk(ys, now().year - 1, 'tavaly') }}

              *Nettó = amit ténylegesen kifizettél: az összes befizetés mínusz minden, ami visszajött neked.*
              {% else %}
              A ZSE szenzorok nem találhatók (be van töltve az integráció?).
              {% endif %}

      # ================================================================== charts
      - type: grid
        cards:
          - type: heading
            heading: Évről évre
            heading_style: title
            icon: mdi:chart-bar
          - type: statistics-graph
            title: Befizetések, visszautalások és nettó évente (a jelmagyarázatra kattintva ki/be kapcsolható)
            chart_type: bar
            period: year
            days_to_show: 7000
            stat_types:
              - change
            entities:
              - entity: zse_energia:advances_paid___ZU__
                name: Befizetett előlegek
                color: '#3d7ee0'
              - entity: zse_energia:settlements_paid___ZU__
                name: Elszámolási pótlék
                color: '#e0803d'
              - entity: zse_energia:other_paid___ZU__
                name: Egyéb befizetések
                color: '#9b9b9b'
              - entity: zse_energia:refunds_received___ZU__
                name: Visszautalások
                color: '#2e9e5b'
              - entity: zse_energia:net_paid___ZU__
                name: Nettó befizetés
                color: '#7a4de0'
          - type: heading
            heading: Fogyasztás
            heading_style: title
            icon: mdi:flash
          - type: statistics-graph
            title: Fogyasztás évente (kWh)
            chart_type: bar
            period: year
            days_to_show: 3000
            stat_types:
              - change
            entities:
              - entity: zse_energia:consumption___ZU__
                name: Fogyasztás
                color: '#e0c23d'
          - type: statistics-graph
            title: Fogyasztás havonta (kWh, utolsó 3 év)
            chart_type: bar
            period: month
            days_to_show: 1100
            stat_types:
              - change
            entities:
              - entity: zse_energia:consumption___ZU__
                name: Fogyasztás
                color: '#e0c23d'

  # ==================================================================== second view: yearly table
  - title: Éves táblázat
    path: zse-table
    icon: mdi:table
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Éves táblázat (EUR)
            heading_style: title
            icon: mdi:table
          - type: markdown
            content: |
              {% macro m2(v) -%}{{ '{:,.2f}'.format(v | float(0)) | replace(',', '#') | replace('.', ',') | replace('#', ' ') }}{%- endmacro %}
              {% macro m0(v) -%}{{ '{:,.0f}'.format(v | float(0)) | replace(',', '#') | replace('#', ' ') }}{%- endmacro %}
              {% set m = integration_entities('zse_energia') | select('is_state_attr', 'zse_history', true) | list %}
              {% if m %}
              {% set e = m[0] %}
              {% set ys = state_attr(e, 'yearly') or [] %}
              {% set since = (state_attr(e, 'since') or '') | string %}
              {% set done = ys | selectattr('year', 'lt', now().year) | list %}
              {% set recent = done[-5:] %}
              Itt látod évenként, mennyit fizettél a ZSE-nek, és mennyit kaptál vissza:
              
              - **Befizetés**: amit abban az évben kifizettél: a havi előlegek és az esetleges elszámolási pótlék együtt.
              - **Visszakaptál**: amit az éves elszámolás után a ZSE visszautalt neked (túlfizetés).
              - **Nettó (költség)**: Befizetés mínusz Visszakaptál. Ez az, amibe az áram abban az évben ténylegesen került.

              | Év | Befizetés | Visszakaptál | Nettó (költség) |
              |---|--:|--:|--:|
              {% for y in ys | reverse -%}
              | {{ y.year }}{% if y.year == now().year %} *(folyamatban)*{% elif ys and y.year == ys[0].year and since[5:] != '01-01' %} *(az adatok kezdetétől)*{% endif %} | {{ m2(y.paid) }} € | {{ m2(y.refunds) }} € | **{{ m2(y.net) }} €** |
              {% endfor %}
              {% if recent %}
              {% set n = recent | length %}
              {% set avg_y = (recent | map(attribute='net') | sum) / n %}
              **Átlagosan {{ m0(avg_y) }} € évente ≈ {{ m0(avg_y / 12) }} € havonta** (az utolsó {{ n }} teljes év alapján)
              {% endif %}

              *A visszautalás az éves elszámolás után érkezik, ezért az adott év nettó összege az abban az évben mozgott pénz, nem pontosan az adott év fogyasztásának az ára.*
              {% else %}
              A ZSE szenzorok nem találhatók (be van töltve az integráció?).
              {% endif %}

